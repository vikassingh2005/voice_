<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <polygon points="60,10 90,40 60,70 30,40" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="12s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="60,25 75,40 60,55 45,40" fill="currentColor" opacity="0.15">
      <animate attributeName="opacity" values="0.15;0.3;0.15" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <line x1="60" y1="10" x2="60" y2="70" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
    <line x1="30" y1="40" x2="90" y2="40" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
    <circle cx="60" cy="40" r="2" fill="currentColor" filter="url(#glowSoft)">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="60" y="100" text-anchor="middle" fill="currentColor" font-family="'Inter','Space Grotesk',sans-serif" font-size="11" font-weight="700" letter-spacing="6" filter="url(#glow)" opacity="0.9">
    PRAVAHA
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
